<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaffleStreet | Dark Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-color: #D4AF37; }
        body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .premium-card { transition: all 0.3s ease; border: 1px solid #334155; border-radius: 1rem; background-color: #1e293b; }
        .premium-card:hover { border-color: var(--primary-color); box-shadow: 0 10px 25px rgba(212, 175, 55, 0.1); }
        #coverHero { height: 280px; background-size: cover; background-position: center; background-image: url('https://images.unsplash.com/photo-1565299585323-38d6b0865b47?auto=format&fit=crop&w=800&q=80'); }
        .cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .cart-overlay.active { opacity: 1; pointer-events: all; }
        .cart-drawer { position: fixed; top: 0; right: -100%; width: 100%; max-width: 400px; height: 100%; background: #0f172a; z-index: 50; transition: right 0.3s ease; overflow-y: auto; border-left: 1px solid #334155; }
        .cart-drawer.active { right: 0; }
    </style>
</head>
<body>
<div id="app" class="max-w-md mx-auto min-h-screen bg-slate-900 shadow-2xl pb-24 overflow-hidden">
    <div id="coverHero" class="relative">
        <div class="absolute inset-0 bg-gradient-to-t from-slate-900 to-transparent"></div>
    </div>

    <header class="text-center px-6 relative -mt-16 z-10">
        <div class="inline-block p-1 bg-slate-800 rounded-full shadow-lg">
            <img id="bizLogo" class="w-24 h-24 rounded-full object-cover hidden">
        </div>
        <h1 id="bizName" class="text-2xl font-extrabold uppercase mt-2 text-white">Loading...</h1>
    </header>
    
    <div id="menuContainer" class="p-6 space-y-8"></div>
    
    <button onclick="toggleCart()" class="fixed bottom-6 left-6 right-6 bg-[#D4AF37] text-slate-900 py-4 rounded-2xl shadow-2xl flex items-center justify-center gap-3 font-bold hover:bg-amber-500 transition z-40">
        <i class="fas fa-shopping-basket"></i>
        VIEW CART (<span id="cartCount">0</span>)
    </button>
</div>

<div id="cartOverlay" class="cart-overlay" onclick="toggleCart()"></div>
<div id="cartDrawer" class="cart-drawer p-6 text-slate-100">
    <!-- Content managed by JS -->
</div>

<script>
    let bizData = {};
    let cart = JSON.parse(localStorage.getItem('waffleCart') || '[]');
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('biz') || 'thewafflestreet-amritsar';
    
    fetch(`./businesses/${slug}.json`)
        .then(res => res.json())
        .then(data => { bizData = data; applyData(); });

    function applyData() {
        document.getElementById('bizName').innerText = bizData.bizName;
        if(bizData.images?.logo) {
            const logo = document.getElementById('bizLogo');
            logo.src = bizData.images.logo;
            logo.classList.remove('hidden');
        }
        renderMenu();
        renderCart();
    }

    function renderMenu() {
        const container = document.getElementById('menuContainer');
        container.innerHTML = bizData.menu.map(cat => `
            <div>
                <h3 class="text-lg font-extrabold mb-4 text-slate-100 border-l-4 border-[#D4AF37] pl-3">${cat.category}</h3>
                <div class="space-y-4">
                    ${cat.items.map(item => `
                        <div class="premium-card flex items-center gap-4 p-3">
                            <div class="w-20 h-20 rounded-xl overflow-hidden shrink-0">
                                <img src="${item.image || 'https://placehold.co/200x200?text=Food'}" class="w-full h-full object-cover">
                            </div>
                            <div class="flex-1">
                                <h4 class="font-bold text-slate-100">${item.name}</h4>
                                <p class="text-xs text-slate-400 line-clamp-1">${item.desc || ''}</p>
                                <p class="font-bold text-[#D4AF37] mt-1">₹${item.price}</p>
                            </div>
                            <button onclick="addToCart('${item.name}', ${item.price})" class="bg-slate-800 w-10 h-10 rounded-full flex items-center justify-center hover:bg-[#D4AF37] hover:text-slate-900 transition">
                                <i class="fas fa-plus text-xs"></i>
                            </button>
                        </div>
                    `).join('')}
                </div>
            </div>
        `).join('');
    }

    function addToCart(name, price) {
        cart.push({ name, price, qty: 1 });
        localStorage.setItem('waffleCart', JSON.stringify(cart));
        renderCart();
        alert(name + " added!");
    }

    function toggleCart() {
        document.getElementById('cartDrawer').classList.toggle('active');
        document.getElementById('cartOverlay').classList.toggle('active');
        renderCart();
    }

    function renderCart() {
        const total = cart.reduce((sum, item) => sum + item.price, 0);
        document.getElementById('cartCount').innerText = cart.length;
        
        document.getElementById('cartDrawer').innerHTML = `
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">Your Cart</h2>
                <button onclick="toggleCart()" class="text-slate-400"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="space-y-4 mb-6">
                ${cart.map((item, i) => `<div class="flex justify-between bg-slate-800 p-3 rounded-lg"><span>${item.name}</span><span class="font-bold">₹${item.price}</span></div>`).join('')}
            </div>
            <div class="text-2xl font-black mb-6">Total: ₹${total}</div>
            <button onclick="showPaymentOptions(${total})" class="w-full bg-[#D4AF37] text-slate-900 py-4 rounded-xl font-bold hover:bg-amber-500 transition">PROCEED TO PAY</button>
        `;
    }

    function showPaymentOptions(total) {
        // Generate QR code for UPI
        const upiId = bizData.upiId || '9599507322@ptaxis';
        const upiLink = `upi://pay?pa=${upiId}&pn=WaffleStreet&am=${total}&cu=INR`;
        const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(upiLink)}`;

        document.getElementById('cartDrawer').innerHTML = `
            <div class="text-center">
                <h2 class="text-xl font-bold mb-6">Scan to Pay</h2>
                <img src="${qrUrl}" class="mx-auto bg-white p-2 rounded-lg mb-4">
                <p class="text-sm text-slate-400 mb-6">Scan with any UPI App (GPay, PhonePe, Paytm)</p>
                <a href="${upiLink}" class="block w-full bg-[#D4AF37] text-slate-900 py-3 rounded-lg font-bold mb-3">Open UPI App</a>
                <button onclick="toggleCart()" class="w-full bg-slate-800 py-3 rounded-lg">Back</button>
            </div>
        `;
    }
</script>
</body>
</html>
