<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaffleStreet | Order Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .gold-theme { --primary: #D4AF37; --bg: #1a1a1a; }
        /* Hero Cover logic */
        #coverHero { height: 250px; background-size: cover; background-position: center; transition: all 0.5s ease; }
        .logo-circle { width: 80px; height: 80px; margin-top: -40px; border: 4px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-slate-50 font-sans">

<div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-2xl pb-24">
    <!-- Cover Image Hero -->
    <div id="coverHero" class="bg-slate-200 relative">
        <div class="absolute inset-0 bg-black/30"></div>
    </div>

    <!-- Header & Logo -->
    <header class="text-center px-4 pb-4">
        <div class="flex justify-center">
            <img id="bizLogo" class="logo-circle rounded-full bg-white object-contain hidden">
        </div>
        <h1 id="bizName" class="text-2xl font-black uppercase mt-2 tracking-widest text-slate-800">Loading...</h1>
        <p class="text-[10px] text-slate-400 uppercase tracking-widest">Amritsar's Favorite Waffles</p>
    </header>

    <!-- Menu Categories -->
    <div id="menuContainer" class="p-4 space-y-8"></div>

    <!-- View Cart Button -->
    <button onclick="toggleCart()" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-black text-white px-8 py-4 rounded-full shadow-2xl flex items-center gap-4 z-50 border-2 border-[#D4AF37] font-bold">
        <i class="fas fa-shopping-basket text-[#D4AF37]"></i>
        VIEW CART (<span id="cartCount">0</span>)
    </button>
</div>

<script>
    let bizData = {};

    const params = new URLSearchParams(window.location.search);
    const slug = params.get('biz') || 'thewafflestreet-amritsar';

    // Fetch the JSON
    fetch(`./businesses/${slug}.json`)
        .then(res => res.json())
        .then(data => {
            bizData = data;
            applyData();
        });

    function applyData() {
        document.getElementById('bizName').innerText = bizData.bizName;

        // 1. Apply Logo
        if(bizData.images && bizData.images.logo) {
            const logoImg = document.getElementById('bizLogo');
            logoImg.src = bizData.images.logo;
            logoImg.classList.remove('hidden');
        }

        // 2. Apply Cover Image
        if(bizData.images && bizData.images.cover) {
            document.getElementById('coverHero').style.backgroundImage = `url('${bizData.images.cover}')`;
        } else {
            // Fallback image if none uploaded
            document.getElementById('coverHero').style.backgroundImage = `url('https://images.unsplash.com/photo-1573335553610-a871dfd95bf5?auto=format&fit=crop&w=800&q=80')`;
        }

        renderMenu();
    }

    function renderMenu() {
        const container = document.getElementById('menuContainer');
        container.innerHTML = bizData.menu.map(cat => `
            <div>
                <h3 class="text-lg font-black border-l-4 border-[#D4AF37] pl-3 mb-4">${cat.category}</h3>
                <div class="space-y-3">
                    ${cat.items.map(item => `
                        <div class="flex gap-3 bg-white p-3 rounded-xl border border-slate-100 shadow-sm">
                            ${item.image ? `<img src="${item.image}" class="w-20 h-20 rounded-lg object-cover">` : ''}
                            <div class="flex-1">
                                <h4 class="font-bold text-sm text-slate-800">${item.name}</h4>
                                <p class="text-[10px] text-slate-400 line-clamp-2">${item.desc}</p>
                                <p class="font-black text-[#D4AF37] mt-1">₹${item.price}</p>
                            </div>
                            <button class="bg-slate-900 text-white w-8 h-8 rounded-full flex items-center justify-center self-center">+</button>
                        </div>
                    `).join('')}
                </div>
            </div>
        `).join('');
    }
</script>
</body>
</html>
