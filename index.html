<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaffleStreet | Fine Dining</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Elegant Font -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-gold: #D4AF37; }
        body { font-family: 'Poppins', sans-serif; background-color: #fcfcfc; color: #334155; }
        h1, h2, h3, h4 { font-family: 'Playfair Display', serif; }
        
        /* Premium Card Style - Clean & Floating */
        .premium-card { 
            transition: all 0.4s ease; 
            border-radius: 1.5rem; 
            background: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .premium-card:hover { 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        
        /* Gold Accent Line */
        .gold-border { border-left: 4px solid var(--primary-gold); }
    </style>
</head>
<body>

<div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-2xl pb-24">
    <!-- Hero with dark overlay -->
    <div id="coverHero" class="relative h-72 bg-slate-800 bg-cover bg-center">
        <div class="absolute inset-0 bg-black/40"></div>
    </div>
    
    <!-- Header -->
    <header class="text-center px-6 relative -mt-20 z-10">
        <div class="inline-block p-2 bg-white rounded-full shadow-xl">
            <img id="bizLogo" class="w-28 h-28 rounded-full object-cover hidden">
        </div>
        <h1 id="bizName" class="text-4xl mt-4 text-slate-900 font-bold tracking-tight">Loading...</h1>
        <p class="text-slate-500 text-sm mt-1 uppercase tracking-widest italic">Fine Dining · Amritsar</p>
    </header>

    <!-- Content -->
    <div id="menuContainer" class="p-6 space-y-10"></div>

    <!-- Floating Cart Button -->
    <button onclick="toggleCart()" class="fixed bottom-6 left-6 right-6 bg-slate-900 text-[#D4AF37] py-5 rounded-full shadow-2xl flex items-center justify-center gap-3 font-bold hover:bg-black transition-all z-50">
        <i class="fas fa-shopping-basket"></i>
        ORDER NOW (<span id="cartCount">0</span>)
    </button>
</div>

<script>
    let bizData = {};
    const slug = new URLSearchParams(window.location.search).get('biz') || 'thewafflestreet-amritsar';

    fetch(`./businesses/${slug}.json`)
        .then(res => res.json())
        .then(data => { bizData = data; applyData(); });

    function applyData() {
        document.getElementById('bizName').innerText = bizData.bizName.replace(/-/g, ' ');
        if(bizData.images?.logo) {
            const logo = document.getElementById('bizLogo');
            logo.src = bizData.images.logo;
            logo.classList.remove('hidden');
        }
        document.getElementById('coverHero').style.backgroundImage = `url('${bizData.images?.cover || 'https://images.unsplash.com/photo-1573335553610-a871dfd95bf5?auto=format&fit=crop&w=800&q=80'}')`;
        renderMenu();
    }

    function renderMenu() {
        const container = document.getElementById('menuContainer');
        
        let featuredHTML = '';
        if (bizData.featuredDish) {
            featuredHTML = `
                <div class="premium-card p-6 border border-amber-200 bg-amber-50/50">
                    <h3 class="text-amber-700 text-sm font-bold uppercase tracking-widest mb-4">★ Chef's Recommendation</h3>
                    <div class="flex items-center gap-6">
                        <img src="${bizData.featuredDish.image}" 
                             onerror="this.src='https://placehold.co/200?text=Image+Not+Found'; console.error('Image link is likely not direct.');"
                             class="w-24 h-24 rounded-2xl object-cover shadow-lg">
                        <div>
                            <h4 class="text-xl font-bold text-slate-900">${bizData.featuredDish.name}</h4>
                            <p class="text-2xl font-bold text-[#D4AF37] mt-1">${bizData.currency}${bizData.featuredDish.price}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        const menuHTML = bizData.menu.map(cat => `
            <div>
                <h3 class="text-2xl font-bold text-slate-900 mb-6 gold-border pl-4">${cat.category}</h3>
                <div class="space-y-6">
                    ${cat.items.map(item => `
                        <div class="premium-card flex items-center gap-4 p-4 border border-slate-100">
                            <div class="w-20 h-20 rounded-2xl overflow-hidden shrink-0">
                                <img src="${item.image || 'https://placehold.co/200?text=Food'}" class="w-full h-full object-cover">
                            </div>
                            <div class="flex-1">
                                <h4 class="font-bold text-slate-900 text-lg">${item.name}</h4>
                                <p class="text-xs text-slate-500 mt-1">${item.desc || ''}</p>
                                <p class="font-bold text-[#D4AF37] mt-2 text-lg">${bizData.currency}${item.price}</p>
                            </div>
                            <button class="bg-slate-100 w-12 h-12 rounded-full flex items-center justify-center hover:bg-[#D4AF37] hover:text-white transition-colors">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                    `).join('')}
                </div>
            </div>
        `).join('');

        container.innerHTML = featuredHTML + menuHTML;
    }

    function toggleCart() { alert("Cart coming soon!"); }
</script>
</body>
</html>
