<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Advanced Admin Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-8">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-2xl shadow">
        <h1 class="text-2xl font-black mb-6">Business & Menu Setup</h1>

        <!-- Logo & Cover -->
        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="border p-4 rounded-xl">
                <label class="block text-xs font-bold mb-2">Logo (Drag & Drop)</label>
                <input type="file" id="up-logo" class="w-full text-xs" accept="image/*">
            </div>
            <div class="border p-4 rounded-xl">
                <label class="block text-xs font-bold mb-2">Cover Image (Drag & Drop)</label>
                <input type="file" id="up-cover" class="w-full text-xs" accept="image/*">
            </div>
        </div>

        <!-- Menu Builder (This is where you add items) -->
        <div id="menu-editor" class="space-y-4">
            <!-- Categories/Items will be generated here -->
        </div>

        <button onclick="downloadJSON()" class="mt-8 w-full bg-black text-white py-4 rounded-xl font-bold">SAVE & DOWNLOAD JSON</button>
    </div>

    <script>
        // Placeholder for base64 images
        let images = { logo: "", cover: "" };

        // Helper to convert file to base64
        function fileToBase64(file, key) {
            const reader = new FileReader();
            reader.onload = e => images[key] = e.target.result;
            reader.readAsDataURL(file);
        }

        document.getElementById('up-logo').onchange = e => fileToBase64(e.target.files[0], 'logo');
        document.getElementById('up-cover').onchange = e => fileToBase64(e.target.files[0], 'cover');

        // Logic to build the JSON
        function downloadJSON() {
            const finalData = {
                bizName: "TheWaffleStreet-Amritsar",
                images: images, // Contains base64 strings
                menu: [
                    {
                        category: "Pancakes",
                        items: [
                            { 
                                name: "Nutella Pancake", 
                                price: 233, 
                                // Paste a link from Unsplash or your own hosted image here
                                image: "https://images.unsplash.com/photo-1598214886806-c87b84b7078b" 
                            }
                        ]
                    }
                ]
            };
            // ... download blob logic ...
        }
    </script>
</body>
</html>
