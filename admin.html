<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Platform Admin | TWS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow p-8">
        <h1 class="text-3xl font-bold mb-8">Business Manager</h1>
        
        <div class="grid grid-cols-2 gap-6">
            <div class="space-y-4">
                <div><label class="block text-sm font-bold">Business Name</label><input type="text" id="a-name" class="w-full border p-2 rounded"></div>
                <div><label class="block text-sm font-bold">WhatsApp Number (e.g. 91...)</label><input type="text" id="a-phone" class="w-full border p-2 rounded"></div>
                <div><label class="block text-sm font-bold">UPI ID</label><input type="text" id="a-upi" class="w-full border p-2 rounded"></div>
                
                <div>
                    <label class="block text-sm font-bold">Add Item Image (Drag & Drop)</label>
                    <input type="file" id="a-img" class="border p-4 w-full border-dashed border-gold rounded text-center">
                    <p class="text-[10px] text-gray-400 mt-1">This will convert image to Base64 for the JSON</p>
                </div>
            </div>

            <div class="bg-stone-50 p-4 border rounded">
                <h3 class="font-bold mb-2">Instructions</h3>
                <ol class="text-sm list-decimal ml-4 space-y-2">
                    <li>Fill business details.</li>
                    <li>Add your menu items.</li>
                    <li>Click <b>"Download JSON"</b>.</li>
                    <li>Upload this JSON to your <code>/businesses/</code> folder on GitHub.</li>
                    <li>Your menu is live at <code>yourlink.com/?biz=slug-name</code></li>
                </ol>
                <button onclick="downloadJSON()" class="mt-8 w-full bg-black text-white py-4 rounded-lg font-bold">DOWNLOAD BUSINESS JSON</button>
            </div>
        </div>
    </div>

    <script>
        function downloadJSON() {
            const data = {
                bizName: document.getElementById('a-name').value,
                phone: document.getElementById('a-phone').value,
                upiId: document.getElementById('a-upi').value,
                menu: [] // This logic would expand to handle your full UI-builder
            };
            
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${data.bizName.toLowerCase().replace(/\s/g, '-')}.json`;
            a.click();
        }
    </script>
</body>
</html>
